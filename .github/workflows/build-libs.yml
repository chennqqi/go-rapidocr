name: build-libs

# Manual pipeline producing the per-platform CLIB shared libraries under
# lib/<os>-<arch>/. Artifacts only — nothing is committed back.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-libs.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'docker/**'
      - 'scripts/**'
      - 'src/**'
      - 'include/**'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  ORT_VERSION: "1.20.1"

jobs:
  # glibc-frozen builds: all C++ deps (onnxruntime, opencv, codec libs,
  # libstdc++) are statically linked into a single libRapidOcrOnnx.so, so the
  # artifact is distro-agnostic. Base image is manylinux_2_28 (AlmaLinux 8,
  # glibc 2.28); the produced .so only references up to GLIBC_2.27.
  # manylinux2014/CentOS 7 cannot be used: its devtoolset gcc forces
  # _GLIBCXX_USE_CXX11_ABI=0, incompatible with the prebuilt static packs.
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Fetch static dep packs
        run: bash scripts/fetch_static_deps.sh x64
      - name: Build libRapidOcrOnnx.so (glibc 2.27 floor)
        run: |
          docker build --build-arg BASE_IMAGE=quay.io/pypa/manylinux_2_28_x86_64 \
              -t go-rapidocr-linux-x64 -f docker/Dockerfile.linux-clib-glibc .
      - name: Export artifacts
        run: |
          cid=$(docker create go-rapidocr-linux-x64)
          docker cp "$cid:/artifacts" out-linux-x64
          docker rm "$cid"
          ls -l out-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: lib-linux-x64
          path: out-linux-x64

  # arm64: static opencv + shared onnxruntime (official aarch64 .so needs
  # only GLIBC_2.27 — no glibc static pack exists upstream).
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Fetch static dep packs
        run: bash scripts/fetch_static_deps.sh arm64
      - name: Build libRapidOcrOnnx.so (glibc 2.28 floor)
        run: |
          docker build --build-arg BASE_IMAGE=quay.io/pypa/manylinux_2_28_aarch64 \
              -t go-rapidocr-linux-arm64 -f docker/Dockerfile.linux-clib-glibc .
      - name: Export artifacts
        run: |
          cid=$(docker create go-rapidocr-linux-arm64)
          docker cp "$cid:/artifacts" out-linux-arm64
          docker rm "$cid"
          ls -l out-linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: lib-linux-arm64
          path: out-linux-arm64

  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-opencv
      - name: Fetch onnxruntime
        run: |
          mkdir -p deps
          curl -fsSL -o deps/ort-win.zip \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-win-x64-${ORT_VERSION}.zip"
          unzip -q deps/ort-win.zip -d deps/
      - name: Build libRapidOcrOnnx.dll
        run: bash scripts/build_clib_mingw.sh
      - name: Collect runtime deps
        run: |
          mkdir -p out-windows-x64
          cp build-clib/libRapidOcrOnnx.dll build-clib/libRapidOcrOnnx.dll.a \
             build-clib/onnxruntime-1.20.dll build-clib/onnxruntime_providers_shared.dll \
             out-windows-x64/
          bash scripts/collect_dll_deps.sh build-clib/libRapidOcrOnnx.dll out-windows-x64
          ls -l out-windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: lib-windows-x64
          path: out-windows-x64

  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { runner: macos-13, arch: x64 }
          - { runner: macos-15, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install deps
        run: brew install cmake opencv
      - name: Fetch onnxruntime
        run: |
          mkdir -p deps
          curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-osx-${{ matrix.arch }}-${ORT_VERSION}.tgz" | tar -xz -C deps
      - name: Build libRapidOcrOnnx.dylib
        run: bash scripts/build_clib_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lib-darwin-${{ matrix.arch }}
          path: build-clib-macos/

  # On tag pushes (v*), collect every platform build and publish a GitHub
  # release with lib-<os>-<arch>.tar.gz assets that fetch_assets.sh can
  # pull directly.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-x64, linux-arm64, windows-x64, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Package platform archives
        run: |
          for d in dist/lib-*; do
            name=$(basename "$d")
            tar -czf "$name.tar.gz" -C "$d" .
            echo "== $name.tar.gz"; tar -tzf "$name.tar.gz" | head
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: lib-*.tar.gz
          generate_release_notes: true
